<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<style>
        body {
    font-family: Arial, sans-serif;
    background: #4a5b74;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    }

        .container {
    background: #ffffff;
    padding: 20px 25px;
    border-radius: 10px;
    width: 100%;
    max-width: 500px;
    box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, 0.1);
    transition: 0.3sec;
    }
    .container:hover{
        transform: scale(1.05);
    }
    h1{
        color: brown;
        text-align: center;
        font-weight: bolder;
        font-size: 30px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .box{
        border-radius: 4px;
        background-color: rgb(136, 136, 136);
        text-align: center;
        height: 30px;
        /* width: 30%; */
        font-weight: bolder;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    

.add-btn {
    background-color: rgb(58, 131, 162);
    color: white;
    font-weight: bold;
    transition: 0.3s;
}

.add-btn:hover {
    background-color: rgb(30, 93, 120);
    transform: scale(1.01);
    box-shadow: 0 5px 15px rgba(186, 213, 230, 0.3);
    color: #272626;
}
.add-bt1
{
    background-color: #3d3c3c;
    color: white;
    transition: 0.3s;
}
.add-bt1:hover {
    background-color: #272626;
    transform: scale(1.01);
    box-shadow: 0 5px 15px rgba(186, 213, 230, 0.3);
    color: #f5efef;
}

</style>


<body>

    <div class="container">
   <div class="row ">
    <h1 style="color: rgb(3, 55, 99); margin-bottom: 25px;">🛒 GROCERY CALCULATOR</h1>    

   </div>
    <div class="row">
    <div class="col-6">
        <div class="box">
            <label> QUANTITY</label>
        </div>
    </div>
    <div class="col-6">
       <div class="box">
            <label>PRICE</label>
        </div>
    </div>
    </div>
    <div class="row mt-3">
  <div class="col-6">
    <input   style="background-color: rgb(204, 206, 206);"   id="item" type="text" class="form-control" placeholder="Item name">
  </div>
  <div class="col-3">
    <input  style="background-color: rgb(204, 206, 206);"  id="qty" type="number" class="form-control" placeholder="Qty">
  </div>
  <div class="col-3">
    <input  style="background-color: rgb(204, 206, 206);"  id="price" type="number" class="form-control" placeholder="Price">
  </div>
</div>


<button class="btn w-100 mt-3 add-btn" onclick="addItem()">Add</button>
<div id="list" class="mt-3"></div>

<div class="alert alert-info text-center mt-3">
  <b>Grand Total: Rs <span id="grandTotal">0</span></b>
</div>
<button class="btn add-bt1 w-100 mt-2" onclick="printReceipt()">Print Receipt</button>


    
</div>




    


<script>
let mode = "estimate";
let grandTotal = 0;

function setMode(m) {
    mode = m;
    clearAll();
}

function addItem() {

    let item = document.getElementById("item").value;
    let qty = document.getElementById("qty").value;
    let price = document.getElementById("price").value;

    if (item === "" || qty === "" || price === "") {
        alert("Please fill all fields");
        return;
    }

    let total = qty * price;
    grandTotal += total;

    let div = document.createElement("div");
    div.className = "d-flex justify-content-between align-items-center border rounded p-2 mb-2 bg-light";

    div.innerHTML = `
        <span><b>${item}</b></span>
        <span>${qty}</span>
        <span>${price}</span>
        <span><b>${total}</b></span>
        <button class="btn btn-danger btn-sm" onclick="deleteRow(this, ${total})">X</button>
    `;

    document.getElementById("list").appendChild(div);
    document.getElementById("grandTotal").innerText = grandTotal;

    document.getElementById("item").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("price").value = "";
    
}

function deleteRow(btn, total) {
    btn.parentElement.remove();
    grandTotal -= total;
    document.getElementById("grandTotal").innerText = grandTotal;
}

function clearAll() {
    document.getElementById("list").innerHTML = "";
    grandTotal = 0;
    document.getElementById("grandTotal").innerText = 0;
}
function printReceipt() {
    let content = document.getElementById("list").innerHTML;
    let newWindow = window.open("", "", "width=400,height=600");

    newWindow.document.write(`
        <h2 style="text-align:center;">Grocery Bill</h2>
        ${content}
        <h3>Total: Rs ${grandTotal}</h3>
    `);

    newWindow.print();
}
</script>




</body>
</html>
